# ZIRH-3 requirements - the traceability chain from the first commit
# (PROGRAM.md H49). scripts/trace_check.py gates CI on it: every
# requirement names its tests and its evidence, no orphans either way.
requirements:
  - id: Z3-R1
    text: A single upset in any one TMR replica of any imported block
      shall never reach a voted output, in any cycle.
    tests:
      - formal/f_ring.sv
    evidence: BMC + k-induction at N=4/8/32 in the formal workflow,
      inherited proof carried live, not cited

  - id: Z3-R2
    text: The memory word shall correct any single-bit storage error,
      detect any double-bit error, and detect ANY read from a wrong
      row as uncorrectable (address-in-ECC).
    tests:
      - formal/f_ecc.sv
      - formal/f_amask.sv
      - test/test_sram39.py
    evidence: SECDED exhaustive proof + even-weight fold proof +
      the 5-slice suite with double-bit and background-scrub cases

  - id: Z3-R3
    text: The memory shall carry a background scrubber that walks the
      whole address space at a fixed rate, itself TMR with a
      safe-state trap, so rare-read words cannot accumulate errors.
    tests:
      - test/test_sram39.py
    evidence: scrub beat and scrub-fix cases in the suite;
      SCRUB_DIV_LOG2 parameter proven at 3

  - id: Z3-R4
    text: A word built from five physical macro slices shall reduce
      any single-macro multi-bit upset to at most one logical bit
      per word.
    tests:
      - test/test_sram39.py
    evidence: the corrupted-merge case; the generate-loop slice
      structure (one definition, five instances)

  - id: Z3-R5
    text: The boot controller shall verify the STORED image by
      read-back CRC before running it, refuse corrupt or oversize or
      wrong-magic images, survive interrupted loads, and revert a
      bank the watchdog fails toward the other bank and then the
      immutable golden copy.
    tests:
      - test/test_boot.py
      - test/sv/zirh_boot_scenarios_tb.sv
    evidence: cocotb contract suite + eight SV stories including
      storage_lie, where only a lying memory can prove the read-back
      claim

  - id: Z3-R6
    text: The QSPI controller shall stream boot images from external
      MRAM in x1 and x4 modes with backpressure expressed as SCK
      freeze, never dropping or duplicating a byte.
    tests:
      - test/test_qspi.py
    evidence: mode-0 timing, QOR dummy cycles and freeze cases in
      the suite; embedded assertions live in simulation

  - id: Z3-R7
    text: The debug port shall be lockable for flight at POR, deny
      all access when locked, and trap its own TMR mismatch to the
      LOCKED state.
    tests:
      - test/test_dbg_gate.py
      - formal/f_dbg.sv
    evidence: lock ladder proof + suite

  - id: Z3-R8
    text: A clock-loss event on the main clock shall be detected and
      latched by an observer running on an independent oscillator,
      with a two-flop synchronized handoff.
    tests:
      - test/test_clkobs.py
    evidence: main-clock-kill case in the suite; the observer
      deliberately carries no main-clock assertions

  - id: Z3-R9
    text: The march/pattern BIST engine shall drive the macro word
      through checkerboard and march elements in static and dynamic
      modes and report per-address failures raw.
    tests:
      - test/test_bist.py
    evidence: pattern engine suite; the A6 bare-macro experiment
      builds on this engine

  - id: Z3-R10
    text: Every TMR structure in the library shall survive synthesis
      with its replicas intact, proven by counting on the optimized
      netlist, with expectations MEASURED and updated only alongside
      the RTL.
    tests:
      - scripts/check_tmr.sh
    evidence: per-block synthesis-integrity run in CI; measured
      numbers recorded at import
  - id: Z3-R11
    text: The memory/boot subsystem shall integrate the loader, the
      sliced SECDED bank, the QSPI image source, the clock-loss
      observer and the debug gate into one harness-independent unit
      that comes out of reset with the loader in charge, the debug
      port locked, and no spurious TMR error - every block keeping its
      replicas through synthesis.
    tests:
      - test/tb_memsys.v
      - scripts/check_tmr.sh
    evidence: zirh3_memsys elaboration smoke (golden strap -> no bank,
      POR debug lock, clean err) + the integration synthesis-integrity
      entry; per-block merge guards remain authoritative
  - id: Z3-R12
    text: The die shall condition its own system reset from the raw pad
      reset plus a brown-out signal (hold through a settle window,
      release synchronized, re-arm on power dropout) and generate its
      own independent oscillator for the clock-loss observer, so the
      standalone die needs no external system reset or observer clock.
    tests:
      - test/tb_por_ro.v
      - test/tb_die.v
      - scripts/check_tmr.sh
    evidence: POR sequence smoke (settle hold, clean release, RO runs,
      brown-out re-arm) + die-level smoke (self-conditioned reset
      brings up the subsystem, loader in charge, debug locked); the
      POR/RO source carries no TMR by design and its count is guarded
  - id: Z3-R13
    text: The SRAM DUT experiment shall drive five BARE macros (no
      SECDED, no scrubber, no voting) through pattern scans and expose
      every mismatch as a raw (address, per-macro bit-map) record, so a
      beam campaign reads the unprotected macro's SEU/MBU cross-section
      directly and the ground analysis can separate single-bit from
      multi-bit upsets within one physical macro.
    tests:
      - test/tb_sram_dut.v
      - scripts/check_tmr.sh
    evidence: clean-array baseline smoke (zero failures with no
      radiation - the floor a campaign subtracts); the pattern engine
      is TMR while the macros under test are deliberately not
  - id: Z3-R14
    text: The die shall carry a JTAG debug port - an IEEE 1149.1 TAP
      speaking the RISC-V external-debug transport (IDCODE, DTMCS, DMI)
      and a Debug Module producing halt/reset/system-bus-access
      requests - whose every effect reaches the core ONLY through the
      flight-locked isolation gate: inert in flight, live on the bench.
    tests:
      - test/tb_jtag.v
      - scripts/check_tmr.sh
    evidence: JTAG smoke - IDCODE shifts out correct, a dmcontrol
      haltreq is held inert by the locked gate (the DM asks, the gate
      refuses) and reaches the core only when the fuse permits; the DM
      control state is TMR, the TAP transport deliberately is not
  - id: Z3-R15
    text: The imported SoC cluster (SERV core, mask ROM with firmware,
      single-master bus with watchdog, UART) shall boot the committed
      firmware and answer on its pins - proving the ZIRH-2 verification
      methodology carries to this tree unchanged before it is wired to
      the memory subsystem.
    tests:
      - test/test_soc.py
    evidence: the SoC cocotb suite retargeted, 3/3 (boot, echo through
      the pins, the living-CPU contract); import ladder rung 2
  - id: Z3-R16
    text: The CPU-carrying top shall load a CRC32-sealed image over the
      UART pin through the loader into the ECC-protected bank while the
      cluster is held in reset, release the CPU only after read-back
      verification, run the LOADED program observably (its output on
      the TX pin), refuse corrupt images with a fallback to the golden
      ROM, and behave identically to the standalone cluster when
      strapped golden.
    tests:
      - test/test_top_isp.py
      - scripts/check_tmr.sh
    evidence: rung-3 suite 3/3 - the loaded program's byte stream
      audible on the pin, corrupt-CRC fallback proven by the ROM's
      echo, golden-strap regression; 45 replicas / 2984 flops measured
      on the full top
  - id: Z3-R17
    text: The five-macro sliced SECDED bank shall serve as CPU data
      memory on the system bus - a loaded program shall write it, read
      it back through the corrected port, and the round trip shall be
      observable from outside the die.
    tests:
      - test/test_top_isp.py
      - scripts/check_tmr.sh
    evidence: the rung-4 bank-prober - loaded code writes 0x4000,
      reads back corrected, and shouts the verdict byte on the TX pin;
      full-top synthesis integrity at 51 replicas / 3253 flops
  - id: Z3-R18
    text: The debugger's System Bus Access master shall read and write
      system memory (the sliced bank) WITHOUT halting the core, taking
      priority over the CPU on the shared port, and every such access
      shall pass through the flight-locked gate: live on the bench,
      wholly inert in flight.
    tests:
      - test/tb_sba.v
      - scripts/check_tmr.sh
    evidence: the SBA smoke - unlocked, a JTAG debugger pokes 0xBEEF
      into the bank and reads it back; locked, the gate holds the SBA
      inert and a seeded word survives an attempted overwrite
  - id: Z3-R19
    text: The compute die shall carry the housekeeping/telemetry cluster
      - the SEU counters, the CPU signature, and the watchdog - and the
      watchdog-revert signon shall complete the boot contract: a loaded
      bank that signs on runs, a loaded bank that never signs on is
      failed by the watchdog after a grace period and reverted to the
      golden ROM, and unprompted telemetry frames carry a valid
      checksum and a living, changing CPU signature.
    tests:
      - test/test_top_isp.py
      - scripts/check_tmr.sh
    evidence: rungs 3-6 suite 6/6 - telemetry frames carry a changing
      CPU signature, and a silent loaded bank is reverted to ROM by the
      watchdog whose echo then answers; full die at 70 replicas / 4192
      flops
  - id: Z3-R20
    text: The sliced SECDED bank's march-test engine shall be reachable
      from software through a bus doorway - a manufacturing-test program
      loaded over the ISP shall start a march, poll the busy bit, and
      report the verdict on the UART, and an in-flight self-test shall
      require nothing more than the same firmware loop.
    tests:
      - test/test_top_isp.py
      - scripts/check_tmr.sh
    evidence: slot-5 MBIST doorway - an ISP-loaded branchless runner
      starts march c-, outlasts the busy stream, and the 0xB1 pass
      verdict reaches the pin; the doorway's mode register holds its
      replicas (3/8 measured)
  - id: Z3-R21
    text: The TAP shall implement SAMPLE/PRELOAD and EXTEST over a
      boundary register spanning every functional pin, and EXTEST's
      pin-drive effect shall be masked by the same absorbing flight
      lock that guards halt and system bus access - board-level
      interconnect test on the bench, an untouchable pin ring in
      flight.
    tests:
      - test/tb_bscan.v
    evidence: SAMPLE reads the real pins through the TAP, EXTEST drags
      uart_tx low and boot_sel high from the chain when unlocked, and
      the same preload lands on deaf pins when locked
  - id: Z3-R22
    text: The dedicated die shall have a proven post-synthesis path to
      full scan that leaves the verified RTL untouched - synthesis to
      foundry cells, flop-for-scan-flop substitution, deterministic
      chain stitching, and a simulated proof of shift and capture on
      the stitched netlist.
    tests:
      - scripts/dft_scan.sh
    evidence: pilot block zirh_clkobs - all 48 flops land in one chain
      on real SG13G2 scan cells, the pattern shifts through intact,
      and a capture cycle overwrites the loaded ones with the true
      reset state (the three reset-to-one flops read back as the only
      ones)
  - id: Z3-R23
    text: The compute upgrade shall have a proven protection path. Two
      candidates are demonstrated on real cells and measured - triple-core
      lockstep (voted bus, sticky divergence flag, recovery via the
      existing reset ladder) and tool-applied flop triplication with
      voted feedback (per-flop self-heal, RTL untouched) - and the
      50 MHz closure campaign selects between them on measured timing.
    tests:
      - test/tb_vex_tmr.v
      - scripts/tmr_pilot.sh
    evidence: pilot A - a corrupted core is outvoted for 2000 cycles
      and flagged sticky; pilot B - the stitched netlist tracks the
      golden model, masks a pinned replica for 100 cycles, and heals
      it on release; core transform measured at 3.5x cells with the
      cache-array caveat recorded
  - id: Z3-R24
    text: The die shall carry at least 64 KB of protected data storage
      built from the proven sliced-SECDED bank - the CPU reaching it
      through a paged window that leaves the bus map and the golden ROM
      untouched, the debugger reaching it flat, and every page carrying
      its own scrubber and march engine behind the doorway.
    tests:
      - test/test_top_isp.py
      - scripts/check_tmr.sh
    evidence: sixteen pages of zirh_sram39 (80 macros) behind the
      TMR'd page register; an ISP-loaded program proves two pages hold
      different words at the same window address and reads both back;
      the full-size array measures 73 replicas / 31406 flops in the
      guard
  - id: Z3-R25
    text: The macro-bound shipping core shall close 50 MHz setup timing
      through full place-and-route on SG13G2 with the cache arrays on
      real RM 2P macros, and any residual hold deficit shall be named,
      bounded, and assigned to signoff.
    tests:
      - pnr/vexlitemac/config.json
    evidence: campaign record in the config and ROADMAP - setup ws
      +5.44 ns at the slow corner post-route, zero routing overflow,
      routing DRC clean; the signoff ECO (Cycle 16) then closed the
      hold residual - 14 buffers on 9 endpoints, 3-corner SPEF
      session reading -0.39 before and +0.15 after with setup
      untouched: every corner closes at 50 MHz
  - id: Z3-R26
    text: The die shall run loaded programs FROM the protected paged
      bank - the loader writing the image flat into the same array the
      scrubbers guard, the CPU fetching flat through its cache behind a
      four-master arbiter (debug, loader, data, fetch), and the golden
      ROM fallback, watchdog revert and MBIST contracts surviving the
      move unchanged.
    tests:
      - test/test_top_isp.py
      - test/tb_sba.v
      - scripts/check_tmr.sh
    evidence: top suite 8/8 on the program-store architecture at first
      run - loaded code executes from the bank via flat fetch, corrupt
      images still fall to ROM, the watchdog still reverts, MBIST
      marches a non-code page, paging isolation holds; boot/soc/SBA/
      boundary-scan/SV suites green; guard at 73/31427 with the
      loader's widened index replicas measured
  - id: Z3-R27
    text: The bank shall scale to 256 KB on the same eighty macros by
      deepening the slices to 4096 rows - banks A/B at 128 KB each, the
      CPU window paged in six bits (instance plus sub-page), the
      address-in-ECC fold bit-identical at the proven default depth,
      and the march unit becoming the 16 KB instance with the test
      runner keeping its computer alive while it tests.
    tests:
      - test/test_top_isp.py
      - scripts/check_tmr.sh
    evidence: DEPTH parameter selects the RM 4096x8 slice; top suite
      8/8 at the 256 KB geometry including the paging isolation and
      the watchdog-petting MBIST runner on instance 1; guard at
      76/31761 with the wider page and scrubber replicas measured
  - id: Z3-R28
    text: The ECO'd layout shall be confirmed by a full routing pass
      with real extracted parasitics at three corners, and the confirm
      shall be a self-healing signoff loop - when the routed truth
      exposes an undershot repair, the repair is redone against that
      truth until every corner closes.
    tests:
      - pnr/vexlitemac/eco_confirm.tcl
    evidence: run 32186904473 - pass 1 measured the estimate's flattery
      (hold -0.53 routed vs +0.15 estimated), the loop inserted two
      more hold buffers against the extracted SPEF, and pass 2 closed
      hold +0.16 / setup +4.71 at every corner on the exact layout
  - id: Z3-R29
    text: The tool-stitched TMR netlist of the compute cluster shall
      boot the full ISP story at gate level; a wound that kills one
      replica rail outright shall be masked by the vote and healed on
      release; a majority wound shall provably kill the machine (the
      control that keeps the proof honest); and the proof-of-life
      discipline shall be immune to the free-running telemetry stream.
    tests:
      - scripts/gl_boot.sh
      - test/test_top_gl.py
    evidence: 2138 flops stitched and structurally checked, none left
      behind (coverage guard); the flood discipline exposed the naive
      single-0x5A hunt as telemetry-contaminated and then exposed a
      fresh-bit collision in the stitcher itself (netname bits missing
      from the seed - raw replicas aliased onto stale nets); with both
      fixed, the rail-B wound booted, healed 2138/2138 and kept
      speaking, and the majority-wound control fell silent
