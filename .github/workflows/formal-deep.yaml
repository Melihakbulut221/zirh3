name: formal-deep
on: workflow_dispatch
# The belt-and-braces N=32 ring proof, on demand. The theorem is already
# gated at N=4/8 in ci.yaml (k-induction is N-independent); this confirms
# it at the shipping ring length when a release wants the extra assurance.
jobs:
  ring32:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: install yosys (apt) and z3 (pip)
        run: |
          sudo apt-get update && sudo apt-get install -y yosys
          pip install z3-solver
          z3 --version
      - name: ring containment at N=8 and N=32
        run: bash scripts/formal.sh 8 32
