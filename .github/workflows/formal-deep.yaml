name: formal-deep
on: workflow_dispatch
# The belt-and-braces N=32 ring proof, on demand. The theorem is already
# gated at N=4/8 in ci.yaml (k-induction is N-independent); this confirms
# it at the shipping ring length when a release wants the extra assurance.
jobs:
  ring32:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: install yosys (apt) and z3 (pip)
        run: |
          sudo apt-get update && sudo apt-get install -y yosys
          pip install z3-solver
          z3 --version
      - name: ring containment at N=8 (full default depth)
        run: SMT_CAP=1800 bash scripts/formal.sh 8
      - name: ring containment at N=32 (induction closes at k=22)
        # Measured recipe: the induction closes at k=22 (in seconds even
        # at N=32), so RING_T=22 bounds the BMC to exactly the base the
        # induction needs - 1171s local, headroom for a slower runner in
        # SMT_CAP. The default depth-24 BMC is dead weight past step 22
        # (that one step alone ~43 min local, and it grows from there).
        run: SMT_CAP=5400 RING_T=22 bash scripts/formal.sh 32
