# =============================================================================
# ZIRH-3 - the 50 MHz P&R closure campaign (Cycle 15)
#
# Dispatchable: hardens the timing pilot (cacheless Min core under the
# shipping wrapper) through LibreLane on SG13G2 and prints the
# post-route corner slacks - the number the synthesis-level campaign
# (scripts/clk_campaign.sh, 21.7 ns typ) cannot see wires for.
# Iterate by editing pnr/vexmin/config.json and re-dispatching; the
# zirh2 placement campaign's discipline applies: one knob per round,
# measured verdicts in the config comments.
# =============================================================================

name: pnr

on:
  workflow_dispatch:
    inputs:
      target:
        description: which campaign job to run
        type: choice
        default: all
        options: [all, min, lite, litemac, eco, ecoconfirm, tmr, tmrconfirm]

jobs:
  eco-confirm:
    if: ${{ inputs.target == 'ecoconfirm' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PDK_ROOT: /home/runner/pdk
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Download the ECO artifact
        run: |
          mkdir -p eco_in eco_out
          for i in 1 2 3 4; do
            gh run download 32079572325 -R ${{ github.repository }} \
              -n hold_eco -D eco_dl && break
            echo "download attempt $i failed; retrying in 30s"
            rm -rf eco_dl; sleep 30
          done
          cp eco_dl/eco_out/zirh_vex_wrap_eco.odb eco_in/
      - name: Setup python + PDK
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install the pinned PDK
        run: |
          pip install ciel
          ciel enable --pdk-family ihp-sg13g2 \
            22f2a25f1734796de3debbbf29cf697cbbc54081 --pdk-root $PDK_ROOT
      - name: Route, extract, judge - the deferred theorem
        run: |
          docker run --rm \
            -v "$PWD:/work" -v "$PDK_ROOT:/pdk" \
            ghcr.io/librelane/librelane:3.0.5 \
            openroad -exit /work/pnr/vexlitemac/eco_confirm.tcl \
            2>&1 | tee confirm.log
          grep -q "CONFIRM DONE" confirm.log
      - name: Verdict gate
        run: |
          grep -aA3 "CONFIRM VERDICT" confirm.log
          MIN=$(grep -a "worst slack min" confirm.log | tail -1 | awk '{print $NF}')
          MAX=$(grep -a "worst slack max" confirm.log | tail -1 | awk '{print $NF}')
          echo "hold ws = $MIN ; setup ws = $MAX"
          python3 -c "import sys; sys.exit(0 if float('$MIN')>=0 and float('$MAX')>=0 else 1)"
          echo "VERDICT: the ECO'd layout closes at every corner, routed and extracted"
      - name: Upload confirm artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: eco_confirm
          path: |
            eco_out/*
            confirm.log

  hold-eco:
    if: ${{ inputs.target == 'eco' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PDK_ROOT: /home/runner/pdk
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Download the 0.15-baseline final artifact
        run: |
          mkdir -p eco_in eco_out
          for i in 1 2 3 4; do
            gh run download 31976805625 -R ${{ github.repository }} \
              -n pnr_vexlitemac -D eco_dl && break
            echo "download attempt $i failed; retrying in 30s"
            rm -rf eco_dl; sleep 30
          done
          cp -r eco_dl/final eco_in/final
      - name: Setup python + PDK (liberty views for STA)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install the pinned PDK
        run: |
          pip install ciel
          ciel enable --pdk-family ihp-sg13g2 \
            22f2a25f1734796de3debbbf29cf697cbbc54081 --pdk-root $PDK_ROOT
      - name: Run the ECO inside the flow's own image
        run: |
          docker run --rm \
            -v "$PWD:/work" -v "$PDK_ROOT:/pdk" \
            ghcr.io/librelane/librelane:3.0.5 \
            openroad -exit /work/pnr/vexlitemac/eco.tcl \
            2>&1 | tee eco.log
          grep -q "ECO DONE" eco.log
      - name: Verdict
        run: |
          echo "== BEFORE/AFTER worst slacks =="
          grep -aA3 "ECO BEFORE" eco.log
          grep -aA3 "ECO AFTER" eco.log
      - name: Upload ECO artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: hold_eco
          path: |
            eco_out/*
            eco.log

  vextmr-confirm:
    if: ${{ inputs.target == 'tmrconfirm' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PDK_ROOT: /home/runner/pdk
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Download the round-2 final artifact
        run: |
          mkdir -p confirm_in confirm_out
          for i in 1 2 3 4; do
            gh run download 32271803469 -R ${{ github.repository }} \
              -n pnr_vextmr -D tmr_dl && break
            echo "download attempt $i failed; retrying in 30s"
            rm -rf tmr_dl; sleep 30
          done
          cp tmr_dl/final/odb/*.odb confirm_in/zirh_vex_wrap.odb
      - name: Replica survival in the ROUTED netlist (round 2 never got here)
        run: |
          NL=$(find tmr_dl/final/nl -name "*.v" | head -1)
          echo "routed netlist: $NL"
          NB=$(grep -c -- "__B " "$NL" || true)
          NC=$(grep -c -- "__C " "$NL" || true)
          NF=$(grep -c "sg13g2_dfrbpq" "$NL" || true)
          echo "replicas: __B=$NB __C=$NC flops=$NF"
          test "$NB" -eq 2138 && test "$NC" -eq 2138 && test "$NF" -eq 6414
          echo "VERDICT: all 2138 triples survived placement and routing"
      - name: Setup python + PDK
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install the pinned PDK
        run: |
          pip install ciel
          ciel enable --pdk-family ihp-sg13g2 \
            22f2a25f1734796de3debbbf29cf697cbbc54081 --pdk-root $PDK_ROOT
      - name: Route, extract, judge, heal - the stitched layout
        run: |
          docker run --rm \
            -v "$PWD:/work" -v "$PDK_ROOT:/pdk" \
            ghcr.io/librelane/librelane:3.0.5 \
            openroad -exit /work/pnr/vextmr/confirm.tcl \
            2>&1 | tee confirm.log
          grep -q "CONFIRM DONE" confirm.log
      - name: Verdict gate
        run: |
          grep -aA3 "CONFIRM VERDICT" confirm.log
          MIN=$(grep -a "worst slack min" confirm.log | tail -1 | awk '{print $NF}')
          MAX=$(grep -a "worst slack max" confirm.log | tail -1 | awk '{print $NF}')
          echo "hold ws = $MIN ; setup ws = $MAX"
          python3 -c "import sys; sys.exit(0 if float('$MIN')>=0 and float('$MAX')>=0 else 1)"
          echo "VERDICT: the STITCHED layout closes at every corner, routed and extracted"
      - name: Upload confirm artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: pnr_vextmr_confirm
          path: |
            confirm_out/*
            confirm.log

  vextmr-50mhz:
    if: ${{ inputs.target == 'tmr' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PDK_ROOT: /home/runner/pdk
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install yosys (netlist build) + LibreLane
        run: |
          sudo apt-get update && sudo apt-get install -y yosys
          pip install librelane==3.0.5 ciel
      - name: Install the pinned PDK
        run: |
          ciel enable --pdk-family ihp-sg13g2 \
            22f2a25f1734796de3debbbf29cf697cbbc54081 --pdk-root $HOME/.ciel
      - name: Build the stitched netlist (bind, synthesize, stitch)
        run: |
          PDK_ROOT=$HOME/.ciel bash scripts/gl_boot.sh bind
          PDK_ROOT=$HOME/.ciel bash scripts/gl_boot.sh gates
          PDK_ROOT=$HOME/.ciel bash scripts/gl_boot.sh stitch
          mkdir -p pnr/vextmr/netlist
          cp test/sim_build/gl_boot/vexwrap_tmr.v pnr/vextmr/netlist/
      - name: Stage macro views
        run: |
          P=$HOME/.ciel/ihp-sg13g2/libs.ref/sg13g2_sram
          mkdir -p pnr/vextmr/pdk
          cp $P/gds/RM_IHPSG13_2P_512x32_c2_bm_bist.gds \
             $P/gds/RM_IHPSG13_2P_64x32_c2.gds \
             $P/lef/RM_IHPSG13_2P_512x32_c2_bm_bist.lef \
             $P/lef/RM_IHPSG13_2P_64x32_c2.lef \
             $P/verilog/RM_IHPSG13_2P_512x32_c2_bm_bist.v \
             $P/verilog/RM_IHPSG13_2P_64x32_c2.v \
             $P/lib/RM_IHPSG13_2P_512x32_c2_bm_bist_typ_1p20V_25C.lib \
             $P/lib/RM_IHPSG13_2P_64x32_c2_typ_1p20V_25C.lib \
             pnr/vextmr/pdk/
      - name: Place and route the STITCHED core at 50 MHz
        # signoff non-judges stay off as in the vexlitemac campaign;
        # the honest gate is the verdict step below
        continue-on-error: true
        run: |
          python -m librelane \
            --docker-no-tty --dockerized \
            --pdk-root "$PDK_ROOT" \
            --pdk ihp-sg13g2 \
            --run-tag vextmr \
            pnr/vextmr/config.json
      - name: Corner slacks + replica survival (the verdict - and its gate)
        run: |
          M=$(find pnr/vextmr/runs/vextmr -name metrics.json | sort | tail -1)
          echo "metrics: $M"
          python3 - "$M" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          bad = False
          for k in sorted(m):
              if "timing__setup__ws" in k or "timing__hold__ws" in k \
                 or "violating" in k or "design__instance__count" in k:
                  print(f"{k} = {m[k]}")
              if ("timing__setup__ws" in k or "timing__hold__ws" in k) \
                 and float(m[k]) < 0:
                  bad = True
          if bad:
              print("VERDICT: timing NOT closed")
              sys.exit(1)
          print("VERDICT: every corner closes - 50 MHz holds, stitched")
          PY
          NL=$(find pnr/vextmr/runs/vextmr/final/nl -name "*.v" | head -1)
          echo "final netlist: $NL"
          NB=$(grep -c -- "__B " "$NL" || true)
          NC=$(grep -c -- "__C " "$NL" || true)
          NF=$(grep -c "sg13g2_dfrbpq" "$NL" || true)
          echo "replicas in the ROUTED netlist: __B=$NB __C=$NC flops=$NF"
          test "$NB" -eq 2138 && test "$NC" -eq 2138 && test "$NF" -eq 6414
          echo "VERDICT: all 2138 triples survived placement and routing"
      - name: Upload artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: pnr_vextmr
          path: |
            pnr/vextmr/runs/vextmr/final/*
            pnr/vextmr/runs/vextmr/*.log
            pnr/vextmr/runs/vextmr/*sta*/**

  vexlitemac-50mhz:
    if: ${{ inputs.target == 'litemac' || inputs.target == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PDK_ROOT: /home/runner/pdk
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install yosys (bind step) + LibreLane
        run: |
          sudo apt-get update && sudo apt-get install -y yosys
          pip install librelane==3.0.5 ciel
      - name: Install the pinned PDK (bind step reads the SRAM models)
        run: |
          ciel enable --pdk-family ihp-sg13g2 \
            22f2a25f1734796de3debbbf29cf697cbbc54081 --pdk-root $HOME/.ciel
      - name: Bind the caches to RM 2P macros
        run: |
          PDK_ROOT=$HOME/.ciel bash scripts/vexlite_bind.sh \
            pnr/vexlitemac/bound/vexlite_bound.v
      - name: Stage macro views
        run: |
          P=$HOME/.ciel/ihp-sg13g2/libs.ref/sg13g2_sram
          mkdir -p pnr/vexlitemac/pdk
          cp $P/gds/RM_IHPSG13_2P_512x32_c2_bm_bist.gds \
             $P/gds/RM_IHPSG13_2P_64x32_c2.gds \
             $P/lef/RM_IHPSG13_2P_512x32_c2_bm_bist.lef \
             $P/lef/RM_IHPSG13_2P_64x32_c2.lef \
             $P/verilog/RM_IHPSG13_2P_512x32_c2_bm_bist.v \
             $P/verilog/RM_IHPSG13_2P_64x32_c2.v \
             $P/lib/RM_IHPSG13_2P_512x32_c2_bm_bist_typ_1p20V_25C.lib \
             $P/lib/RM_IHPSG13_2P_64x32_c2_typ_1p20V_25C.lib \
             pnr/vexlitemac/pdk/
      - name: Place and route the macro-bound core at 50 MHz
        # signoff non-judges (Magic/KLayout/LVS) are disabled for this
        # timing campaign, and the flow's quality gate insists they
        # report - so the flow's exit is advisory here and the HONEST
        # gate is the verdict step below: green iff timing closes.
        continue-on-error: true
        run: |
          python -m librelane \
            --docker-no-tty --dockerized \
            --pdk-root "$PDK_ROOT" \
            --pdk ihp-sg13g2 \
            --run-tag vexlitemac \
            pnr/vexlitemac/config.json
      - name: Corner slacks (the campaign's verdict - and its gate)
        run: |
          M=$(find pnr/vexlitemac/runs/vexlitemac -name metrics.json | sort | tail -1)
          echo "metrics: $M"
          python3 - "$M" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          bad = False
          for k in sorted(m):
              if "timing__setup__ws" in k or "timing__hold__ws" in k \
                 or "violating" in k or "design__instance__count" in k:
                  print(f"{k} = {m[k]}")
              if ("timing__setup__ws" in k or "timing__hold__ws" in k) \
                 and float(m[k]) < 0:
                  bad = True
          if bad:
              print("VERDICT: timing NOT closed")
              sys.exit(1)
          print("VERDICT: every corner closes - 50 MHz holds")
          PY
      - name: Upload artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: pnr_vexlitemac
          path: |
            pnr/vexlitemac/runs/vexlitemac/final/*
            pnr/vexlitemac/runs/vexlitemac/*.log
            pnr/vexlitemac/runs/vexlitemac/*sta*/**

  vexlite-50mhz:
    if: ${{ inputs.target == 'lite' || inputs.target == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PDK_ROOT: /home/runner/pdk
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install LibreLane
        run: pip install librelane==3.0.5
      - name: Place and route the shipping core at 50 MHz
        run: |
          python -m librelane \
            --docker-no-tty --dockerized \
            --pdk-root "$PDK_ROOT" \
            --pdk ihp-sg13g2 \
            --run-tag vexlite \
            pnr/vexlite/config.json
      - name: Corner slacks (the campaign's verdict)
        if: success() || failure()
        run: |
          M=$(find pnr/vexlite/runs/vexlite -name metrics.json | sort | tail -1)
          echo "metrics: $M"
          python3 - "$M" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          for k in sorted(m):
              if "timing__setup__ws" in k or "timing__hold__ws" in k \
                 or "violating" in k or "design__instance__count" in k \
                 or "design__die__area" in k:
                  print(f"{k} = {m[k]}")
          PY
      - name: Upload artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: pnr_vexlite
          path: |
            pnr/vexlite/runs/vexlite/final/*
            pnr/vexlite/runs/vexlite/*.log

  vexmin-50mhz:
    if: ${{ inputs.target == 'min' || inputs.target == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PDK_ROOT: /home/runner/pdk
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install LibreLane
        run: pip install librelane==3.0.5

      - name: Place and route at 50 MHz
        run: |
          python -m librelane \
            --docker-no-tty --dockerized \
            --pdk-root "$PDK_ROOT" \
            --pdk ihp-sg13g2 \
            --run-tag vexmin \
            pnr/vexmin/config.json

      - name: Corner slacks (the campaign's verdict)
        if: success() || failure()
        run: |
          M=$(find pnr/vexmin/runs/vexmin -name metrics.json | sort | tail -1)
          echo "metrics: $M"
          python3 - "$M" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          for k in sorted(m):
              if "timing__setup__ws" in k or "timing__hold__ws" in k \
                 or "clock__skew" in k or "violating" in k:
                  print(f"{k} = {m[k]}")
          PY

      - name: Upload artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: pnr_vexmin
          path: |
            pnr/vexmin/runs/vexmin/final/*
            pnr/vexmin/runs/vexmin/*.log
