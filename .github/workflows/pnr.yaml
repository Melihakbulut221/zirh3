# =============================================================================
# ZIRH-3 - the 50 MHz P&R closure campaign (Cycle 15)
#
# Dispatchable: hardens the timing pilot (cacheless Min core under the
# shipping wrapper) through LibreLane on SG13G2 and prints the
# post-route corner slacks - the number the synthesis-level campaign
# (scripts/clk_campaign.sh, 21.7 ns typ) cannot see wires for.
# Iterate by editing pnr/vexmin/config.json and re-dispatching; the
# zirh2 placement campaign's discipline applies: one knob per round,
# measured verdicts in the config comments.
# =============================================================================

name: pnr

on:
  workflow_dispatch:
    inputs:
      target:
        description: which campaign job to run
        type: choice
        default: all
        options: [all, min, lite, litemac, eco, ecoconfirm, tmr, tmrconfirm, tmrboot, signoff, eqpnr]

jobs:
  eco-confirm:
    if: ${{ inputs.target == 'ecoconfirm' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PDK_ROOT: /home/runner/pdk
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Download the ECO artifact
        run: |
          mkdir -p eco_in eco_out
          for i in 1 2 3 4; do
            gh run download 32079572325 -R ${{ github.repository }} \
              -n hold_eco -D eco_dl && break
            echo "download attempt $i failed; retrying in 30s"
            rm -rf eco_dl; sleep 30
          done
          cp eco_dl/eco_out/zirh_vex_wrap_eco.odb eco_in/
      - name: Setup python + PDK
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install the pinned PDK
        run: |
          pip install ciel
          ciel enable --pdk-family ihp-sg13g2 \
            22f2a25f1734796de3debbbf29cf697cbbc54081 --pdk-root $PDK_ROOT
      - name: Route, extract, judge - the deferred theorem
        run: |
          docker run --rm \
            -v "$PWD:/work" -v "$PDK_ROOT:/pdk" \
            ghcr.io/librelane/librelane:3.0.5 \
            openroad -exit /work/pnr/vexlitemac/eco_confirm.tcl \
            2>&1 | tee confirm.log
          grep -q "CONFIRM DONE" confirm.log
      - name: Verdict gate
        run: |
          grep -aA3 "CONFIRM VERDICT" confirm.log
          MIN=$(grep -a "worst slack min" confirm.log | tail -1 | awk '{print $NF}')
          MAX=$(grep -a "worst slack max" confirm.log | tail -1 | awk '{print $NF}')
          echo "hold ws = $MIN ; setup ws = $MAX"
          python3 -c "import sys; sys.exit(0 if float('$MIN')>=0 and float('$MAX')>=0 else 1)"
          echo "VERDICT: the ECO'd layout closes at every corner, routed and extracted"
      - name: Upload confirm artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: eco_confirm
          path: |
            eco_out/*
            confirm.log

  hold-eco:
    if: ${{ inputs.target == 'eco' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PDK_ROOT: /home/runner/pdk
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Download the 0.15-baseline final artifact
        run: |
          mkdir -p eco_in eco_out
          for i in 1 2 3 4; do
            gh run download 31976805625 -R ${{ github.repository }} \
              -n pnr_vexlitemac -D eco_dl && break
            echo "download attempt $i failed; retrying in 30s"
            rm -rf eco_dl; sleep 30
          done
          cp -r eco_dl/final eco_in/final
      - name: Setup python + PDK (liberty views for STA)
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install the pinned PDK
        run: |
          pip install ciel
          ciel enable --pdk-family ihp-sg13g2 \
            22f2a25f1734796de3debbbf29cf697cbbc54081 --pdk-root $PDK_ROOT
      - name: Run the ECO inside the flow's own image
        run: |
          docker run --rm \
            -v "$PWD:/work" -v "$PDK_ROOT:/pdk" \
            ghcr.io/librelane/librelane:3.0.5 \
            openroad -exit /work/pnr/vexlitemac/eco.tcl \
            2>&1 | tee eco.log
          grep -q "ECO DONE" eco.log
      - name: Verdict
        run: |
          echo "== BEFORE/AFTER worst slacks =="
          grep -aA3 "ECO BEFORE" eco.log
          grep -aA3 "ECO AFTER" eco.log
      - name: Upload ECO artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: hold_eco
          path: |
            eco_out/*
            eco.log

  vextmr-eqpnr:
    if: ${{ inputs.target == 'eqpnr' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PDK_ROOT: /home/runner/pdk
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Download the layout's own netlist (Cycle 21 boot run)
        # artifacts expire; when this one does, re-dispatch tmrboot to
        # mint a fresh netlist from the confirmed ODB and repoint
        run: |
          for i in 1 2 3 4; do
            gh run download 32330298237 -R ${{ github.repository }} \
              -n pnr_vextmr_boot -D eq_dl && break
            echo "download attempt $i failed; retrying in 30s"
            rm -rf eq_dl; sleep 30
          done
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install yosys + ciel
        run: |
          sudo apt-get update && sudo apt-get install -y yosys
          pip install ciel
      - name: Install the pinned PDK
        run: |
          ciel enable --pdk-family ihp-sg13g2 \
            22f2a25f1734796de3debbbf29cf697cbbc54081 --pdk-root $HOME/.ciel
      - name: Rebuild the stitched netlist (the gold side)
        run: |
          PDK_ROOT=$HOME/.ciel bash scripts/gl_boot.sh bind
          PDK_ROOT=$HOME/.ciel bash scripts/gl_boot.sh gates
          PDK_ROOT=$HOME/.ciel bash scripts/gl_boot.sh stitch
      - name: Cycle 29 - place-and-route preserved the stitched function
        run: |
          PDK_ROOT=$HOME/.ciel bash scripts/formal_equiv.sh pnr \
            "$PWD/eq_dl/confirm_out/zirh_vex_wrap_pnr.v"
      - name: Upload proof log
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: eqpnr_proof
          path: test/sim_build/equiv/pnr.log

  vextmr-signoff:
    if: ${{ inputs.target == 'signoff' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PDK_ROOT: /home/runner/pdk
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Download the stitched final artifact
        run: |
          for i in 1 2 3 4; do
            gh run download 32271803469 -R ${{ github.repository }} \
              -n pnr_vextmr -D tmr_dl && break
            echo "download attempt $i failed; retrying in 30s"
            rm -rf tmr_dl; sleep 30
          done
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install klayout module + ciel
        run: pip install klayout ciel
      - name: Install the pinned PDK (cell SPICE models)
        run: |
          ciel enable --pdk-family ihp-sg13g2 \
            22f2a25f1734796de3debbbf29cf697cbbc54081 --pdk-root $PDK_ROOT
      - name: GDS merge sanity - XOR the two streamouts
        # magic and klayout each merge the RM macro GDS into the die by
        # independent code paths; identical geometry is the merge proof
        run: |
          python3 scripts/xor_streams.py \
            tmr_dl/final/gds/zirh_vex_wrap.gds \
            tmr_dl/final/klayout_gds/zirh_vex_wrap.klayout.gds \
            zirh_vex_wrap | tee xor.log
          N=$(grep -a "XOR TOTAL" xor.log | awk '{print $3}')
          test "$N" -eq 0
          echo "VERDICT: the two streamouts merge to identical geometry"
      - name: LVS - extracted layout vs powered netlist (raw netgen)
        run: |
          docker run --rm \
            -v "$PWD:/work" -v "$PDK_ROOT:/pdk" \
            ghcr.io/librelane/librelane:3.0.5 \
            bash /work/scripts/signoff_lvs.sh \
              /work/tmr_dl/final/spice/zirh_vex_wrap.spice \
              /work/tmr_dl/final/pnl/zirh_vex_wrap.pnl.v \
              /work/lvs.netgen.rpt \
            2>&1 | tee lvs.log
      - name: LVS verdict ledger
        # round 1 enumerated the ledger; this gate PINS it. Two known
        # classes, both tool-view frictions, zero real connectivity
        # errors: (1) the RM macro power pins are named VDD/VSS/
        # VDDARRAY by the abstract LEF the extraction saw and VDD!/
        # VSS!/VDDARRAY! by the verilog model the netlist uses - same
        # physical pins, 6 one-pin nets on the layout side, net delta
        # exactly 4; (2) dbus_adr_o[1:0] and ibus_adr_o[1:0] are all
        # tielo constants - electrically identical ports netgen
        # cannot disambiguate (its own printed caveat). Devices must
        # match EXACTLY; any new mismatch class fails this job.
        run: |
          echo "=== NETGEN FINAL RESULT ==="
          tail -20 lvs.netgen.rpt
          grep -qaE "Final result" lvs.netgen.rpt
          DEV=$(grep -ac "Number of devices: .*Mismatch" lvs.netgen.rpt || true)
          echo "device-count mismatch lines: $DEV (must be 0)"
          test "$DEV" -eq 0
          FRAG=$(grep -ac "^Net: u_core.IBusCachedPlugin_cache.icache_" lvs.netgen.rpt || true)
          echo "unmatched net fragments: $FRAG (must be 6, all icache macro power pins)"
          test "$FRAG" -eq 6
          ROGUE=$(grep -aE "^Net: " lvs.netgen.rpt | grep -acv "icache_" || true)
          echo "unmatched nets OUTSIDE the known class: $ROGUE (must be 0)"
          test "$ROGUE" -eq 0
          PINS=$(grep -acE "^(dbus|ibus)_adr_o\[[01]\].*Mismatch" lvs.netgen.rpt || true)
          echo "port mismatches on the four constant bits: $PINS (must be 4)"
          test "$PINS" -eq 4
          ROGUEPINS=$(grep -a "\*\*Mismatch\*\*" lvs.netgen.rpt | grep -av "Number of nets" | grep -avcE "^(dbus|ibus)_adr_o" || true)
          echo "mismatch marks outside the known classes: $ROGUEPINS (must be 0)"
          test "$ROGUEPINS" -eq 0
          echo "VERDICT: devices match exactly; the only mismatches are the two enumerated tool-view classes"
      - name: Upload signoff artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: pnr_vextmr_signoff
          path: |
            xor.log
            lvs.log
            lvs.netgen.rpt

  vextmr-boot:
    if: ${{ inputs.target == 'tmrboot' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PDK_ROOT: /home/runner/pdk
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Download the CONFIRMED layout (Cycle 20 seal run)
        run: |
          mkdir -p confirm_in confirm_out
          for i in 1 2 3 4; do
            gh run download 32295970007 -R ${{ github.repository }} \
              -n pnr_vextmr_confirm -D boot_dl && break
            echo "download attempt $i failed; retrying in 30s"
            rm -rf boot_dl; sleep 30
          done
          cp boot_dl/confirm_out/zirh_vex_wrap_confirm.odb confirm_in/zirh_vex_wrap.odb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install iverilog + python deps
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog
          pip install -r test/requirements.txt ciel
      - name: Install the pinned PDK
        run: |
          ciel enable --pdk-family ihp-sg13g2 \
            22f2a25f1734796de3debbbf29cf697cbbc54081 --pdk-root $PDK_ROOT
      - name: Write the layout's own netlist
        run: |
          docker run --rm \
            -v "$PWD:/work" -v "$PDK_ROOT:/pdk" \
            ghcr.io/librelane/librelane:3.0.5 \
            openroad -exit /work/pnr/vextmr/dump_netlist.tcl \
            2>&1 | tee dump.log
          grep -q "NETLIST DUMPED" dump.log
      - name: The layout's netlist boots, wounded and healed
        run: |
          PDK_ROOT=$PDK_ROOT bash scripts/gl_pnr_boot.sh \
            "$PWD/confirm_out/zirh_vex_wrap_pnr.v"
      - name: Upload artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: pnr_vextmr_boot
          path: |
            confirm_out/zirh_vex_wrap_pnr.v
            test/sim_build/gl_pnr/*.xml

  vextmr-confirm:
    if: ${{ inputs.target == 'tmrconfirm' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PDK_ROOT: /home/runner/pdk
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Download the round-2 final artifact
        run: |
          mkdir -p confirm_in confirm_out
          for i in 1 2 3 4; do
            gh run download 32271803469 -R ${{ github.repository }} \
              -n pnr_vextmr -D tmr_dl && break
            echo "download attempt $i failed; retrying in 30s"
            rm -rf tmr_dl; sleep 30
          done
          cp tmr_dl/final/odb/*.odb confirm_in/zirh_vex_wrap.odb
      - name: Replica survival in the ROUTED layout (rail nets, by name)
        # instance names are erased by the netlist writers (abc privates
        # become _N_), but the stitcher's rail NETS survive as real
        # wires all the way into the routed DEF - count those. Each
        # test stands alone: a && chain is exempt from bash -e and a
        # guard that cannot fail guards nothing (learned in round 5).
        run: |
          DEF=$(find tmr_dl/final/def -name "*.def" | head -1)
          echo "routed DEF: $DEF"
          for R in tmrA tmrB tmrC; do
            N=$(grep -cE "^ *- ${R}_[0-9]+ " "$DEF" || true)
            echo "$R rail nets in the routed DEF: $N"
            test "$N" -eq 2173
          done
          NF=$(grep -cE "sg13g2_dfrbpq" "$DEF" || true)
          echo "flop instances: $NF"
          test "$NF" -eq 6519
          echo "VERDICT: all 2173 triples survived placement and routing"
      - name: Setup python + PDK
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install the pinned PDK
        run: |
          pip install ciel
          ciel enable --pdk-family ihp-sg13g2 \
            22f2a25f1734796de3debbbf29cf697cbbc54081 --pdk-root $PDK_ROOT
      - name: Route, extract, judge, heal - the stitched layout
        run: |
          docker run --rm \
            -v "$PWD:/work" -v "$PDK_ROOT:/pdk" \
            ghcr.io/librelane/librelane:3.0.5 \
            openroad -exit /work/pnr/vextmr/confirm.tcl \
            2>&1 | tee confirm.log
          grep -q "CONFIRM DONE" confirm.log
      - name: Verdict gate
        run: |
          grep -aA3 "CONFIRM VERDICT" confirm.log
          MIN=$(grep -a "worst slack min" confirm.log | tail -1 | awk '{print $NF}')
          MAX=$(grep -a "worst slack max" confirm.log | tail -1 | awk '{print $NF}')
          echo "hold ws = $MIN ; setup ws = $MAX"
          python3 -c "import sys; sys.exit(0 if float('$MIN')>=0 and float('$MAX')>=0 else 1)"
          NFLOPS=$(grep -a "FLOPS IN THE CONFIRMED LAYOUT" confirm.log | awk '{print $NF}')
          echo "flops in the confirmed layout: $NFLOPS"
          test "$NFLOPS" -eq 6519
          for R in tmrA tmrB tmrC; do
            N=$(grep -cE "^ *- ${R}_[0-9]+ " confirm_out/zirh_vex_wrap_confirm.def || true)
            echo "$R rail nets in the CONFIRMED DEF: $N"
            test "$N" -eq 2173
          done
          echo "VERDICT: the STITCHED layout closes at every corner, routed and extracted, triples intact"
      - name: Upload confirm artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: pnr_vextmr_confirm
          path: |
            confirm_out/*
            confirm.log

  vextmr-50mhz:
    if: ${{ inputs.target == 'tmr' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PDK_ROOT: /home/runner/pdk
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install yosys (netlist build) + LibreLane
        run: |
          sudo apt-get update && sudo apt-get install -y yosys
          pip install librelane==3.0.5 ciel
      - name: Install the pinned PDK
        run: |
          ciel enable --pdk-family ihp-sg13g2 \
            22f2a25f1734796de3debbbf29cf697cbbc54081 --pdk-root $HOME/.ciel
      - name: Build the stitched netlist (bind, synthesize, stitch)
        run: |
          PDK_ROOT=$HOME/.ciel bash scripts/gl_boot.sh bind
          PDK_ROOT=$HOME/.ciel bash scripts/gl_boot.sh gates
          PDK_ROOT=$HOME/.ciel bash scripts/gl_boot.sh stitch
          mkdir -p pnr/vextmr/netlist
          cp test/sim_build/gl_boot/vexwrap_tmr.v pnr/vextmr/netlist/
      - name: Stage macro views
        run: |
          P=$HOME/.ciel/ihp-sg13g2/libs.ref/sg13g2_sram
          mkdir -p pnr/vextmr/pdk
          cp $P/gds/RM_IHPSG13_2P_512x32_c2_bm_bist.gds \
             $P/gds/RM_IHPSG13_2P_64x32_c2.gds \
             $P/lef/RM_IHPSG13_2P_512x32_c2_bm_bist.lef \
             $P/lef/RM_IHPSG13_2P_64x32_c2.lef \
             $P/verilog/RM_IHPSG13_2P_512x32_c2_bm_bist.v \
             $P/verilog/RM_IHPSG13_2P_64x32_c2.v \
             $P/lib/RM_IHPSG13_2P_512x32_c2_bm_bist_typ_1p20V_25C.lib \
             $P/lib/RM_IHPSG13_2P_64x32_c2_typ_1p20V_25C.lib \
             pnr/vextmr/pdk/
      - name: Place and route the STITCHED core at 50 MHz
        # signoff non-judges stay off as in the vexlitemac campaign;
        # the honest gate is the verdict step below
        continue-on-error: true
        run: |
          python -m librelane \
            --docker-no-tty --dockerized \
            --pdk-root "$PDK_ROOT" \
            --pdk ihp-sg13g2 \
            --run-tag vextmr \
            pnr/vextmr/config.json
      - name: Corner slacks + replica survival (the verdict - and its gate)
        run: |
          M=$(find pnr/vextmr/runs/vextmr -name metrics.json | sort | tail -1)
          echo "metrics: $M"
          python3 - "$M" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          bad = False
          for k in sorted(m):
              if "timing__setup__ws" in k or "timing__hold__ws" in k \
                 or "violating" in k or "design__instance__count" in k:
                  print(f"{k} = {m[k]}")
              if ("timing__setup__ws" in k or "timing__hold__ws" in k) \
                 and float(m[k]) < 0:
                  bad = True
          if bad:
              print("VERDICT: timing NOT closed")
              sys.exit(1)
          print("VERDICT: every corner closes - 50 MHz holds, stitched")
          PY
          NL=$(find pnr/vextmr/runs/vextmr/final/nl -name "*.v" | head -1)
          echo "final netlist: $NL"
          NB=$(grep -c -- "__B " "$NL" || true)
          NC=$(grep -c -- "__C " "$NL" || true)
          NF=$(grep -c "sg13g2_dfrbpq" "$NL" || true)
          echo "replicas in the ROUTED netlist: __B=$NB __C=$NC flops=$NF"
          # separate test lines: an && chain is exempt from bash -e, so
          # a failing middle link would slip through as a passing step
          test "$NB" -eq 2173
          test "$NC" -eq 2173
          test "$NF" -eq 6519
          echo "VERDICT: all 2173 triples survived placement and routing"
      - name: Upload artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: pnr_vextmr
          path: |
            pnr/vextmr/runs/vextmr/final/*
            pnr/vextmr/runs/vextmr/*.log
            pnr/vextmr/runs/vextmr/*sta*/**

  vexlitemac-50mhz:
    if: ${{ inputs.target == 'litemac' || inputs.target == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PDK_ROOT: /home/runner/pdk
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install yosys (bind step) + LibreLane
        run: |
          sudo apt-get update && sudo apt-get install -y yosys
          pip install librelane==3.0.5 ciel
      - name: Install the pinned PDK (bind step reads the SRAM models)
        run: |
          ciel enable --pdk-family ihp-sg13g2 \
            22f2a25f1734796de3debbbf29cf697cbbc54081 --pdk-root $HOME/.ciel
      - name: Bind the caches to RM 2P macros
        run: |
          PDK_ROOT=$HOME/.ciel bash scripts/vexlite_bind.sh \
            pnr/vexlitemac/bound/vexlite_bound.v
      - name: Stage macro views
        run: |
          P=$HOME/.ciel/ihp-sg13g2/libs.ref/sg13g2_sram
          mkdir -p pnr/vexlitemac/pdk
          cp $P/gds/RM_IHPSG13_2P_512x32_c2_bm_bist.gds \
             $P/gds/RM_IHPSG13_2P_64x32_c2.gds \
             $P/lef/RM_IHPSG13_2P_512x32_c2_bm_bist.lef \
             $P/lef/RM_IHPSG13_2P_64x32_c2.lef \
             $P/verilog/RM_IHPSG13_2P_512x32_c2_bm_bist.v \
             $P/verilog/RM_IHPSG13_2P_64x32_c2.v \
             $P/lib/RM_IHPSG13_2P_512x32_c2_bm_bist_typ_1p20V_25C.lib \
             $P/lib/RM_IHPSG13_2P_64x32_c2_typ_1p20V_25C.lib \
             pnr/vexlitemac/pdk/
      - name: Place and route the macro-bound core at 50 MHz
        # signoff non-judges (Magic/KLayout/LVS) are disabled for this
        # timing campaign, and the flow's quality gate insists they
        # report - so the flow's exit is advisory here and the HONEST
        # gate is the verdict step below: green iff timing closes.
        continue-on-error: true
        run: |
          python -m librelane \
            --docker-no-tty --dockerized \
            --pdk-root "$PDK_ROOT" \
            --pdk ihp-sg13g2 \
            --run-tag vexlitemac \
            pnr/vexlitemac/config.json
      - name: Corner slacks (the campaign's verdict - and its gate)
        run: |
          M=$(find pnr/vexlitemac/runs/vexlitemac -name metrics.json | sort | tail -1)
          echo "metrics: $M"
          python3 - "$M" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          bad = False
          for k in sorted(m):
              if "timing__setup__ws" in k or "timing__hold__ws" in k \
                 or "violating" in k or "design__instance__count" in k:
                  print(f"{k} = {m[k]}")
              if ("timing__setup__ws" in k or "timing__hold__ws" in k) \
                 and float(m[k]) < 0:
                  bad = True
          if bad:
              print("VERDICT: timing NOT closed")
              sys.exit(1)
          print("VERDICT: every corner closes - 50 MHz holds")
          PY
      - name: Upload artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: pnr_vexlitemac
          path: |
            pnr/vexlitemac/runs/vexlitemac/final/*
            pnr/vexlitemac/runs/vexlitemac/*.log
            pnr/vexlitemac/runs/vexlitemac/*sta*/**

