name: ci
on: [push, workflow_dispatch]
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: install verilator + yosys
        run: sudo apt-get update && sudo apt-get install -y verilator yosys
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: cache the IHP PDK
        uses: actions/cache@v4
        with:
          path: ~/.ciel
          key: ciel-ihp-22f2a25f1734796de3debbbf29cf697cbbc54081
      - name: install the pinned PDK
        run: |
          pip install ciel
          ciel enable --pdk-family ihp-sg13g2 \
            22f2a25f1734796de3debbbf29cf697cbbc54081
      - name: lint (warning-clean policy)
        run: PDK_ROOT=$HOME/.ciel bash scripts/lint.sh
      - name: requirements traceability
        run: python3 scripts/trace_check.py
      - name: synthesis integrity (replicas survive)
        run: bash scripts/check_tmr.sh

  units:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: python deps
        run: pip install -r test/requirements.txt
      - name: cache the IHP PDK
        uses: actions/cache@v4
        with:
          path: ~/.ciel
          key: ciel-ihp-22f2a25f1734796de3debbbf29cf697cbbc54081
      - name: install the pinned PDK
        run: |
          pip install ciel
          ciel enable --pdk-family ihp-sg13g2 \
            22f2a25f1734796de3debbbf29cf697cbbc54081
      - name: unit suites
        run: PDK_ROOT=$HOME/.ciel make units
      - name: JTAG debug port suite
        run: make -C test -B -f Makefile.jtag
      - name: imported SoC cluster suite
        run: PDK_ROOT=$HOME/.ciel make -C test -B -f Makefile.soc
      - name: rung 3 - the top's ISP contract end to end
        run: PDK_ROOT=$HOME/.ciel make -C test -B -f Makefile.top
      - name: SV boot scenarios
        run: make sv

  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: install yosys (apt) and z3 (pip - apt's z3 is ~8x slower,
          it tripped the ecc proof's 300s cap; measured)
        run: |
          sudo apt-get update && sudo apt-get install -y yosys
          pip install z3-solver
          z3 --version
      # ring containment is proven by k-induction, which is N-INDEPENDENT:
      # ONE N proves the theorem. CI runs N=4 (plus ECC, address mask,
      # debug lock); N=8 and the shipping N=32 are belt-and-braces in the
      # dispatchable formal-deep workflow. Every proof is wrapped in a
      # per-call 300s cap (scripts/formal.sh smt()), so a runner-slow
      # solver names itself in the log instead of eating the job budget.
      - name: ring (N=4), ECC, address mask, debug lock
        run: bash scripts/formal.sh 4
