name: ci
on: [push, workflow_dispatch]
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: install verilator + yosys
        run: sudo apt-get update && sudo apt-get install -y verilator yosys
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: cache the IHP PDK
        uses: actions/cache@v4
        with:
          path: ~/.ciel
          key: ciel-ihp-22f2a25f1734796de3debbbf29cf697cbbc54081
      - name: install the pinned PDK
        run: |
          pip install ciel
          ciel enable --pdk-family ihp-sg13g2 \
            22f2a25f1734796de3debbbf29cf697cbbc54081
      - name: lint (warning-clean policy)
        run: PDK_ROOT=$HOME/.ciel bash scripts/lint.sh
      - name: requirements traceability
        run: python3 scripts/trace_check.py
      - name: synthesis integrity (replicas survive)
        run: bash scripts/check_tmr.sh

  units:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: python deps
        run: pip install -r test/requirements.txt
      - name: cache the IHP PDK
        uses: actions/cache@v4
        with:
          path: ~/.ciel
          key: ciel-ihp-22f2a25f1734796de3debbbf29cf697cbbc54081
      - name: install the pinned PDK
        run: |
          pip install ciel
          ciel enable --pdk-family ihp-sg13g2 \
            22f2a25f1734796de3debbbf29cf697cbbc54081
      - name: unit suites
        run: PDK_ROOT=$HOME/.ciel make units
      - name: SV boot scenarios
        run: make sv

  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: install yosys + z3
        run: sudo apt-get update && sudo apt-get install -y yosys z3
      # ring containment is proven by k-induction, which is N-INDEPENDENT:
      # N=4 and N=8 prove the theorem; the shipping N=32 is belt-and-braces
      # and runs in the dispatchable formal-deep workflow, off the per-push
      # path (a single N=32 k-induction step can exceed the CI budget).
      - name: rings (N=4,8), ECC, address mask, debug lock
        run: bash scripts/formal.sh 4 8
