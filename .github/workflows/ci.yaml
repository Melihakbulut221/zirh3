name: ci
on: [push, workflow_dispatch]
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: install verilator + yosys + iverilog
        run: sudo apt-get update && sudo apt-get install -y verilator yosys iverilog
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: cache the IHP PDK
        uses: actions/cache@v4
        with:
          path: ~/.ciel
          key: ciel-ihp-22f2a25f1734796de3debbbf29cf697cbbc54081
      - name: install the pinned PDK
        run: |
          pip install ciel
          ciel enable --pdk-family ihp-sg13g2 \
            22f2a25f1734796de3debbbf29cf697cbbc54081
      - name: lint (warning-clean policy)
        run: PDK_ROOT=$HOME/.ciel bash scripts/lint.sh
      - name: requirements traceability
        run: python3 scripts/trace_check.py
      - name: synthesis integrity (replicas survive)
        run: bash scripts/check_tmr.sh
      - name: F28 - scan-insertion rehearsal (stitched chain shifts)
        run: PDK_ROOT=$HOME/.ciel bash scripts/dft_scan.sh
      - name: rung 3 pilot B - tool-applied TMR (function, mask, heal)
        run: PDK_ROOT=$HOME/.ciel bash scripts/tmr_pilot.sh

  units:
    runs-on: ubuntu-24.04
    # the pipelined core simulates ~3-4x slower than the bit-serial one
    # it replaced; the top suite alone runs 8-19 minutes locally, and the
    # runner is slower still - 30 minutes was the SERV era's budget
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: python deps
        run: pip install -r test/requirements.txt
      - name: cache the IHP PDK
        uses: actions/cache@v4
        with:
          path: ~/.ciel
          key: ciel-ihp-22f2a25f1734796de3debbbf29cf697cbbc54081
      - name: install the pinned PDK
        run: |
          pip install ciel
          ciel enable --pdk-family ihp-sg13g2 \
            22f2a25f1734796de3debbbf29cf697cbbc54081
      - name: unit suites
        run: PDK_ROOT=$HOME/.ciel make units
      - name: JTAG debug port suite
        run: make -C test -B -f Makefile.jtag
      - name: Cycle 14 - the new core's first breath (VexRiscv smoke)
        run: make -C test -B -f Makefile.vex
      - name: rung 3 pilot A - triple-core lockstep under fire
        run: make -C test -B -f Makefile.vextmr
      - name: imported SoC cluster suite
        run: PDK_ROOT=$HOME/.ciel make -C test -B -f Makefile.soc
      - name: rungs 3-4 - the top's ISP contract + bank as CPU memory
        run: PDK_ROOT=$HOME/.ciel make -C test -B -f Makefile.top
      - name: rung 5 - debugger SBA reaches the bank through the gate
        run: PDK_ROOT=$HOME/.ciel make -C test -B -f Makefile.sba
      - name: F28 - boundary scan behind the flight lock
        run: PDK_ROOT=$HOME/.ciel make -C test -B -f Makefile.bscan
      - name: SV boot scenarios
        run: make sv

  gl:
    runs-on: ubuntu-24.04
    # synthesis ~4 min, then three gate-level sims of the full top
    # (baseline boot, stitched boot, wound trio) - ~5 min locally,
    # the shared runner is slower still
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: install yosys + iverilog
        run: sudo apt-get update && sudo apt-get install -y yosys iverilog
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: python deps
        run: pip install -r test/requirements.txt
      - name: cache the IHP PDK
        uses: actions/cache@v4
        with:
          path: ~/.ciel
          key: ciel-ihp-22f2a25f1734796de3debbbf29cf697cbbc54081
      - name: install the pinned PDK
        run: |
          pip install ciel
          ciel enable --pdk-family ihp-sg13g2 \
            22f2a25f1734796de3debbbf29cf697cbbc54081
      - name: Cycle 19 - the TMR'd core boots at gate level, wounded and healed
        run: PDK_ROOT=$HOME/.ciel make gl

  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: install yosys (apt) and z3 (pip - apt's z3 is ~8x slower,
          it tripped the ecc proof's 300s cap; measured)
        run: |
          sudo apt-get update && sudo apt-get install -y yosys
          pip install z3-solver
          z3 --version
      # ring containment is proven by k-induction, which is N-INDEPENDENT:
      # ONE N proves the theorem. CI runs N=4 (plus ECC, address mask,
      # debug lock); N=8 and the shipping N=32 are belt-and-braces in the
      # dispatchable formal-deep workflow. Every proof is wrapped in a
      # per-call 300s cap (scripts/formal.sh smt()), so a runner-slow
      # solver names itself in the log instead of eating the job budget.
      - name: ring (N=4), ECC, address mask, debug lock
        run: bash scripts/formal.sh 4
